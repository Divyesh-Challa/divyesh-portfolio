<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGradAI)" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="60" cy="60" r="44" fill="#0D1117" stroke="#34D399" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Vector Dimension Axis Lines (Subtle) -->
  <line x1="60" y1="28" x2="60" y2="92" stroke="#4B5563" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="28" y1="60" x2="92" y2="60" stroke="#4B5563" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="36" y1="36" x2="84" y2="84" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Neural / Vector Synaptic Connections -->
  <g stroke="url(#aiGrad)" stroke-width="1.6" opacity="0.85">
    <line x1="60" y1="44" x2="42" y2="66"/>
    <line x1="60" y1="44" x2="78" y2="66"/>
    <line x1="42" y1="66" x2="60" y2="82"/>
    <line x1="78" y1="66" x2="60" y2="82"/>
    <line x1="42" y1="66" x2="78" y2="66"/>
  </g>

  <!-- High-Dimensional Vector Cluster Nodes -->
  <circle cx="60" cy="44" r="4.5" fill="#C084FC" filter="url(#glowAI)"/>
  <circle cx="60" cy="44" r="2.2" fill="#FFFFFF"/>

  <circle cx="42" cy="66" r="4" fill="#60A5FA" filter="url(#glowAI)"/>
  <circle cx="42" cy="66" r="2" fill="#FFFFFF"/>

  <circle cx="78" cy="66" r="4" fill="#38BDF8" filter="url(#glowAI)"/>
  <circle cx="78" cy="66" r="2" fill="#FFFFFF"/>

  <circle cx="60" cy="82" r="4.5" fill="#34D399" filter="url(#glowAI)"/>
  <circle cx="60" cy="82" r="2.2" fill="#FFFFFF"/>

  <!-- Central Intelligence AI Sparkle Star -->
  <g transform="translate(60, 61)" filter="url(#glowAI)">
    <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="#F8FAFC"/>
    <circle cx="0" cy="0" r="2.5" fill="#F43F5E"/>
  </g>

  <!-- Accent satellite vector points -->
  <circle cx="34" cy="46" r="2" fill="#A855F7" opacity="0.8"/>
  <circle cx="86" cy="48" r="2" fill="#34D399" opacity="0.8"/>
</svg>
