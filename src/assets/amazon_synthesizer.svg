<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="amazonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="drawerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentScore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base Window -->
  <rect width="800" height="500" rx="16" fill="url(#amazonDark)"/>
  
  <!-- Browser Chrome Top Bar -->
  <path d="M0,16 Q0,0 16,0 L784,0 Q800,0 800,16 L800,42 L0,42 Z" fill="#1E293B"/>
  <circle cx="28" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5.5" fill="#10B981"/>
  
  <rect x="180" y="9" width="440" height="24" rx="12" fill="#0F172A"/>
  <text x="400" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="500">amazon.ca/dp/B08N5WRWNW · Review Synthesizer Active</text>

  <!-- Left Side: Amazon Product Listing Simulation -->
  <g transform="translate(40, 65)">
    <!-- Amazon Header Bar simulation -->
    <rect x="0" y="0" width="370" height="38" rx="8" fill="#1E293B"/>
    <text x="14" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">amazon<tspan fill="#F59E0B">.ca</tspan></text>
    <rect x="110" y="8" width="180" height="22" rx="4" fill="#0F172A"/>
    <text x="120" y="23" font-family="sans-serif" font-size="10" fill="#64748B">mechanical keyboard wireless...</text>
    <rect x="300" y="8" width="56" height="22" rx="4" fill="#F59E0B"/>
    <text x="328" y="23" font-family="sans-serif" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Search</text>

    <!-- Product Details Card -->
    <g transform="translate(0, 52)">
      <!-- Product Image Mockup -->
      <rect x="0" y="0" width="150" height="150" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Keyboard wireframe icon -->
      <rect x="25" y="45" width="100" height="60" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <g fill="#38BDF8">
        <rect x="35" y="55" width="12" height="10" rx="2"/>
        <rect x="52" y="55" width="12" height="10" rx="2"/>
        <rect x="69" y="55" width="12" height="10" rx="2"/>
        <rect x="86" y="55" width="28" height="10" rx="2"/>
        <rect x="35" y="70" width="18" height="10" rx="2"/>
        <rect x="58" y="70" width="40" height="10" rx="2"/>
        <rect x="103" y="70" width="11" height="10" rx="2"/>
        <rect x="50" y="85" width="50" height="10" rx="2"/>
      </g>

      <!-- Product Meta -->
      <text x="165" y="18" font-family="sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Pro Wireless Mechanical Keyboard</text>
      <text x="165" y="36" font-family="sans-serif" font-size="11" font-weight="500" fill="#38BDF8">Brand: Keychron · Hot-swappable · RGB</text>
      
      <!-- Stars & Price -->
      <g transform="translate(165, 48)">
        <text x="0" y="14" font-family="sans-serif" font-size="13" fill="#FBBF24">★★★★☆</text>
        <text x="75" y="13" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">3,482 ratings</text>
        <text x="0" y="42" font-family="sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">$129.99</text>
        <text x="90" y="42" font-family="sans-serif" font-size="11" font-weight="500" fill="#10B981">Prime FREE One-Day</text>
      </g>
    </g>

    <!-- Raw Review Nodes being parsed -->
    <g transform="translate(0, 220)">
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Raw Customer Reviews (15 Sampled for LLM Analysis)</text>
      <rect x="0" y="24" width="370" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="10" y="42" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">"Awesome tactile feedback, but battery life drains in 3 days..."</text>
      <text x="10" y="60" font-family="sans-serif" font-size="9.5" fill="#64748B">Verified Purchase · 4 stars · Filtered: carrier delivery comment excluded</text>

      <rect x="0" y="84" width="370" height="52" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="10" y="102" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">"Bluetooth disconnects randomly on macOS Monterey sleep mode."</text>
      <text x="10" y="120" font-family="sans-serif" font-size="9.5" fill="#64748B">Verified Purchase · 2 stars · Hardware flaw flagged</text>
    </g>
  </g>

  <!-- Right Side: The AI Review Synthesizer On-Page Extension Drawer -->
  <g transform="translate(435, 58)">
    <rect x="0" y="0" width="335" height="425" rx="14" fill="url(#drawerBg)" stroke="#38BDF8" stroke-width="2" filter="url(#shadowBox)"/>
    
    <!-- Extension Drawer Header -->
    <g transform="translate(16, 18)">
      <circle cx="10" cy="10" r="10" fill="#38BDF8"/>
      <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle">AI</text>
      <text x="28" y="14" font-family="sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">Review Synthesizer</text>
      <rect x="235" y="0" width="56" height="20" rx="10" fill="#065F46"/>
      <text x="263" y="14" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="middle">READY · 2.1s</text>
    </g>

    <!-- Score & Authenticity Block -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="303" height="66" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      
      <!-- Reliability Score Badge -->
      <g transform="translate(14, 10)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">RELIABILITY SCORE</text>
        <text x="0" y="42" font-family="sans-serif" font-size="30" font-weight="900" fill="#34D399">8.6<tspan font-size="15" fill="#64748B">/10</tspan></text>
      </g>

      <!-- Authenticity & Defect Rate -->
      <g transform="translate(155, 10)">
        <rect x="0" y="0" width="134" height="20" rx="4" fill="#1E293B"/>
        <text x="67" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">🛡️ 9.4/10 Authentic</text>

        <rect x="0" y="26" width="134" height="20" rx="4" fill="#1E293B"/>
        <text x="67" y="40" font-family="sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">⏳ Low Defect Risk</text>
      </g>
    </g>

    <!-- Pros & Cons Matrix Grid -->
    <g transform="translate(16, 128)">
      <!-- Pros Column -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="147" height="110" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
        <rect x="8" y="8" width="50" height="16" rx="4" fill="#065F46"/>
        <text x="33" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#34D399" text-anchor="middle">✓ PROS</text>
        <text x="10" y="42" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Solid aluminum frame</text>
        <text x="10" y="58" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Exceptional switch feel</text>
        <text x="10" y="74" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Clean Mac/Win switch</text>
        <text x="10" y="90" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• True hot-swappable</text>
      </g>

      <!-- Cons Column -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="147" height="110" rx="8" fill="#0F172A" stroke="#E11D48" stroke-width="1.5"/>
        <rect x="8" y="8" width="50" height="16" rx="4" fill="#881337"/>
        <text x="33" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#FDA4AF" text-anchor="middle">✕ CONS</text>
        <text x="10" y="42" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Bluetooth sleep lag</text>
        <text x="10" y="58" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Dim RGB passthrough</text>
        <text x="10" y="74" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• High profile wrist strain</text>
        <text x="10" y="90" font-family="sans-serif" font-size="9.5" fill="#E2E8F0">• Stock ABS keycaps</text>
      </g>
    </g>

    <!-- Interactive AI Q&A Card -->
    <g transform="translate(16, 250)">
      <rect x="0" y="0" width="303" height="74" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">💬 Ask the Reviews (Conversational Q&amp;A)</text>
      <rect x="12" y="26" width="215" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="20" y="41" font-family="sans-serif" font-size="9.5" fill="#94A3B8">Does this keyboard work well on macOS?</text>
      <rect x="233" y="26" width="58" height="22" rx="4" fill="#2563EB"/>
      <text x="262" y="41" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ask AI</text>
      <text x="12" y="62" font-family="sans-serif" font-size="9" fill="#34D399">✓ 142 reviews confirm full native macOS media keys &amp; layout support.</text>
    </g>

    <!-- Action Bar -->
    <g transform="translate(16, 336)">
      <rect x="0" y="0" width="303" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="151" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Export Buying Decision Brief (PDF)</text>
    </g>
  </g>
</svg>
